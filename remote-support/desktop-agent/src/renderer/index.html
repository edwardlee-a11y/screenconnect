<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemoteSupport Agent</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f12; --panel: #13161b; --border: #1f2530; --border2: #2a3040;
      --accent: #00e5a0; --accent2: #0077ff; --warn: #ff6b35; --danger: #ef4444;
      --text: #e4e8f0; --muted: #5a6070; --muted2: #8899aa;
      --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; user-select: none; }
    button { font-family: var(--sans); cursor: pointer; transition: opacity .15s; }
    button:hover { opacity: .8; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* Title bar (frameless) */
    .titlebar {
      height: 38px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
      -webkit-app-region: drag;
    }
    .titlebar-logo { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 2px; }
    .titlebar-btns { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .tb-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--border2); color: var(--muted); font-size: 12px; display: flex; align-items: center; justify-content: center; }

    /* Main content */
    .content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* Session code block */
    .code-block {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; text-align: center;
    }
    .code-label { font-size: 10px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .code-value { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: 8px; color: var(--accent); }
    .code-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* Status row */
    .status-row { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.online  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.session { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1.5s infinite; }
    .status-dot.error   { background: var(--danger); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    .status-text { font-size: 12px; font-family: var(--mono); color: var(--muted2); }

    /* Chat */
    .chat-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; height: 140px; }
    .chat-msgs  { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .chat-msgs::-webkit-scrollbar { width: 4px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .chat-input-row { display: flex; border-top: 1px solid var(--border); align-items: center; }
    .chat-input { flex: 1; background: transparent; border: none; color: var(--text); padding: 8px 10px; font-size: 12px; outline: none; font-family: var(--sans); }
    .chat-attach { padding: 0 8px; background: transparent; border: none; color: var(--muted2); font-size: 14px; cursor: pointer; }
    .chat-attach:hover { color: var(--accent); }
    .chat-send  { padding: 0 12px; background: transparent; border: none; color: var(--accent); font-size: 14px; }

    .msg-bubble { padding: 5px 9px; border-radius: 6px; font-size: 12px; max-width: 90%; }
    .msg-agent  { align-self: flex-end; background: rgba(0,229,160,.08); border: 1px solid rgba(0,229,160,.15); color: #c0f0d8; }
    .msg-device { align-self: flex-start; background: var(--border); color: var(--text); }
    .msg-sys    { align-self: center; font-size: 10px; font-family: var(--mono); color: var(--muted); }
    .chat-img   { max-width: 100%; max-height: 120px; border-radius: 4px; margin-top: 4px; display: block; }
    .chat-file  { font-size: 11px; color: var(--accent); display: block; margin-top: 4px; text-decoration: none; }
    .chat-file:hover { text-decoration: underline; }

    /* Buttons */
    .btn { padding: 9px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; border: none; }
    .btn-primary { background: var(--accent); color: #000; width: 100%; }
    .btn-danger  { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.3); width: 100%; }
    .btn-secondary { background: var(--panel); color: var(--muted2); border: 1px solid var(--border); padding: 6px 12px; font-size: 11px; }

    /* Settings panel */
    .settings { display: none; flex-direction: column; gap: 10px; }
    .settings.open { display: flex; }
    .settings input { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 12px; outline: none; width: 100%; }
    .settings input:focus { border-color: var(--accent); }
    .settings-row { display: flex; justify-content: space-between; align-items: center; }
    .settings-label { font-size: 11px; font-family: var(--mono); color: var(--muted); }

    /* Share badge */
    .sharing-badge {
      display: none; align-items: center; justify-content: center; gap: 8px;
      background: rgba(255,107,53,.1); border: 1px solid rgba(255,107,53,.3);
      border-radius: 8px; padding: 8px; font-size: 12px; color: var(--warn);
    }
    .sharing-badge.active { display: flex; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1s infinite; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Frameless title bar -->
<div class="titlebar">
  <div class="titlebar-logo">AGENT</div>
  <div class="titlebar-btns">
    <button class="tb-btn" id="btnSettings" title="Settings">⚙</button>
    <button class="tb-btn" onclick="window.agent.minimizeWindow()">—</button>
    <button class="tb-btn" onclick="window.agent.hideWindow()">✕</button>
  </div>
</div>

<div class="content">

  <!-- Session code -->
  <div class="code-block">
    <div class="code-label">Session Code</div>
    <div class="code-value" id="codeDisplay">——</div>
    <div class="code-sub">Share this code with your support agent</div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Connecting to server…</div>
  </div>

  <!-- Sharing active badge -->
  <div class="sharing-badge" id="sharingBadge">
    <div class="live-dot"></div>
    <span>Screen sharing active</span>
  </div>

  <!-- Chat -->
  <div class="chat-wrap">
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="Message agent…" />
      <button class="chat-attach" id="chatAttach" title="Attach file">📎</button>
      <button class="chat-send" id="chatSend">→</button>
    </div>
  </div>

  <!-- Stop sharing button (shown during session) -->
  <button class="btn btn-danger hidden" id="btnStop">Stop Sharing</button>

  <!-- Settings -->
  <div>
    <div class="settings-row" style="margin-bottom: 8px;">
      <span class="settings-label">Settings</span>
      <button class="btn-secondary" id="btnToggleSettings">▸ Show</button>
    </div>
    <div class="settings" id="settingsPanel">
      <div>
        <div class="settings-label" style="margin-bottom: 5px;">Server URL</div>
        <input type="text" id="serverUrlInput" placeholder="http://localhost:4000" />
      </div>
      <button class="btn btn-primary" id="btnSaveSettings">Save &amp; Reconnect</button>
    </div>
  </div>

</div>

<script src="renderer.js"></script>
</body>
</html>
